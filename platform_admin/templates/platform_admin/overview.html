{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform -- Sellify</title>
<link rel="stylesheet" href="{% static 'duka/css/duka.css' %}">
<style>
  .wrap.pf { max-width: 960px; }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap pf">
    <div class="wordmark">Sell<span>ify</span> <span style="font-family:var(--mono);font-size:13px;color:var(--ink-soft);">platform</span></div>
    <div class="masthead-meta"><a href="{% url 'tenants:signup' %}" style="text-decoration:underline;">SIgnUp</a></div>
    <div class="masthead-meta" id="refreshed-at">&nbsp;</div>
  </div>
</header>

<main>
  <div class="wrap pf">
    <h1>All shops</h1>
    <p class="lede">Recurring revenue, renewals and account overrides across every tenant.</p>


<div class="kpis" id="kpis">
      <div class="kpi"><div class="label">Total Revenue</div><div class="value">--</div></div>
      <div class="kpi"><div class="label">MRR</div><div class="value">--</div></div>
      <div class="kpi"><div class="label">ARR</div><div class="value">--</div></div>
      <div class="kpi"><div class="label">Active shops</div><div class="value">--</div></div>
    </div>

    <div id="alert" class="alert bad" role="alert"></div>

    <div class="filter-bar">
      <input id="search" type="text" placeholder="Search by shop name, code or phone&hellip;">
      <select id="status-filter">
        <option value="">All statuses</option>
        <option value="ACTIVE">Active</option>
        <option value="PAST_DUE">Past due</option>
        <option value="SUSPENDED">Suspended</option>
        <option value="PENDING">Pending</option>
        <option value="TRIALING">Trialing</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
    </div>

    <table class="ledger">
      <thead>
        <tr><th>Shop</th><th>Status</th><th class="num">Users</th><th>Renews / expired</th><th></th></tr>
      </thead>
      <tbody id="tenant-rows">
        <tr class="empty-row"><td colspan="5">Loading&hellip;</td></tr>
      </tbody>
    </table>
    <div style="margin-top:14px;">
      <button class="secondary" id="load-more" hidden>Load more</button>
    </div>
  </div>
</main>

<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="drawer-close" id="drawer-close" aria-label="Close">&times;</button>
  <div id="drawer-content">Loading&hellip;</div>
</aside>

<script src="{% static 'duka/js/duka-api.js' %}"></script>
<script src="{% static 'duka/js/platform.js' %}"></script>
</body>
</html>
