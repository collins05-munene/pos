<div class="product-link-row item-row" style="background: #f9fafb; padding: 1.25rem; border-radius: 6px; border: 1px solid #e5e7eb; margin-bottom: 1rem;">
    {{ item_form.id }}
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; align-items: end;">
        {% for field in item_form.visible_fields %}
            {% if field.name == 'DELETE' %}
                <div class="field-widget-container" style="color: #991b1b; display: flex; align-items: center; gap: 0.25rem; padding-bottom: 0.5rem;">
                    {{ field }} {{ field.label_tag }}
                </div>
            {% else %}
                <div class="field-widget-container">
                    <label for="{{ field.id_for_label }}" style="display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.25rem;">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <span style="color: #dc3545; font-size: 0.75rem;">{{ error }}</span>
                    {% endfor %}
                </div>
            {% endif %}
        {% endfor %}
    </div>
</div>
