{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Cashier Terminal Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <link rel="stylesheet" href="{% static 'users/css/auth.css' %}">
</head>

<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-progress-container" id="progressContainer">
            <div class="auth-progress-bar"></div>
        </div>

        <div class="auth-logo">
            <img src="{% static 'img/unisale-logo.png' %}" alt="UniSale Systems" width="409" height="141">
        </div>

        <h2 class="auth-title">Cashier Login</h2>

        <form method="POST" id="authForm">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="alert-banner alert-danger">
                    {{ form.non_field_errors|striptags }}
                </div>
            {% endif %}

            <div class="form-group">
                <label>Shop Code</label>
                <input type="text" name="shop_code" placeholder="e.g. mama-njeri-mart-2" required autofocus autocapitalize="none" autocorrect="off" spellcheck="false">
            </div>

            <div class="form-group">
                <label>Cashier Username</label>
                <input type="text" name="username" placeholder="e.g. njeri" required autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username">
            </div>

            <div class="form-group">
                <label>PIN</label>
                <input type="password" id="id_pin" name="pin" required maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password">
            </div>
            
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn-primary" id="submitBtn">Authenticate</button>
        </form>

        <a href="{% url 'login' %}" class="toggle-auth-link">
            Management Login (Password)
        </a>
    </div>
</div>

<script>
    document.getElementById('authForm').addEventListener('submit', function(e) {
        const container = document.getElementById('progressContainer');
        const btn = document.getElementById('submitBtn');
        
        container.style.display = 'block';
        btn.disabled = true;
        btn.style.opacity = '0.7';
        btn.innerText = 'Authenticating...';
    });
</script>

</body>
</html>
