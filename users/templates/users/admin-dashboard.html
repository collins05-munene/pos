{% extends 'users/base.html' %}
{% load static %}

{% block title %}Overview{% endblock %}

{% block extra_head %}
<style>
.dash {
    --dash-card: #ffffff;
    --dash-border: #e2e8f0;
    --dash-text: #0f172a;
    --dash-muted: #64748b;
    --dash-good: #047857;
    --dash-good-bg: #d1fae5;
    --dash-bad: #be123c;
    --dash-bad-bg: #ffe4e6;
    --dash-warn: #b45309;
    --dash-warn-bg: #fef3c7;
    --dash-neutral-bg: #f1f5f9;
    --dash-accent: #4338ca;
    --dash-accent-light: #4f46e5;

    color: var(--dash-text);
    font-family: system-ui, -apple-system, sans-serif;
}

/* ---------- Live status bar ---------- */
.dash-live-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    font-size: 0.85rem;
    color: var(--dash-muted);
}
.live-indicator {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    background: var(--dash-good-bg);
    color: var(--dash-good);
    font-weight: 600;
    font-size: 0.78rem;
}
.live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
}
.live-indicator.is-live .live-dot { animation: live-pulse 2s ease-in-out infinite; }
.live-indicator.is-paused  { background: var(--dash-neutral-bg); color: var(--dash-muted); }
.live-indicator.is-offline { background: var(--dash-warn-bg); color: var(--dash-warn); }
@keyframes live-pulse { 50% { opacity: .35; } }

/* ---------- KPI cards ---------- */
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.25rem;
    margin-bottom: 2rem;
}
.kpi-card {
    background: var(--dash-card);
    border: 1px solid var(--dash-border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
}
.kpi-label {
    color: var(--dash-muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 600;
}
.kpi-value {
    font-size: 1.85rem;
    font-weight: 700;
    margin: 0.5rem 0;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
}
.kpi-delta {
    font-size: 0.8rem;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
}
.kpi-delta.up   { color: var(--dash-good); background: var(--dash-good-bg); }
.kpi-delta.down { color: var(--dash-bad);  background: var(--dash-bad-bg); }
.kpi-delta.flat { color: var(--dash-muted); background: var(--dash-neutral-bg); }

.pay-pills { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.75rem; }
.pay-pill {
    background: rgba(79, 70, 229, 0.08);
    border: 1px solid rgba(79, 70, 229, 0.15);
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    color: var(--dash-accent-light);
    font-weight: 500;
}

/* ---------- Panels & tables ---------- */
.lists-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(400px, 100%), 1fr));
    gap: 1.25rem;
}
.dash-panel {
    background: var(--dash-card);
    border: 1px solid var(--dash-border);
    border-radius: 12px;
    padding: 1.5rem;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    min-width: 0;
}
.dash-panel h3 {
    margin: 0 0 1.25rem 0;
    font-size: 1rem;
    font-weight: 600;
    color: var(--dash-text);
}
.table-scroll { overflow-x: auto; }

table.dash-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.dash-table th {
    text-align: left;
    color: var(--dash-muted);
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--dash-border);
}
table.dash-table td {
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--dash-border);
    vertical-align: middle;
    font-variant-numeric: tabular-nums;
}
table.dash-table tbody tr:hover td { background: #f8fafc; }
table.dash-table tr:last-child td { border-bottom: none; }

.badge-low {
    color: var(--dash-bad);
    font-weight: 600;
    background: var(--dash-bad-bg);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
}

/* ---------- Cashier status ---------- */
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    white-space: nowrap;
}
.badge-live    { color: var(--dash-good);  background: var(--dash-good-bg); }
.badge-idle    { color: var(--dash-warn);  background: var(--dash-warn-bg); }
.badge-offline { color: var(--dash-muted); background: var(--dash-neutral-bg); }
.last-seen { display: block; margin-top: 0.2rem; font-size: 0.72rem; color: var(--dash-muted); }

.empty-note { color: var(--dash-muted); font-size: 0.85rem; padding: 1.5rem 0; text-align: center; }

.view-link {
    color: var(--dash-accent-light);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    background: rgba(79, 70, 229, 0.06);
    transition: background 0.2s;
}
.view-link:hover { background: rgba(79, 70, 229, 0.15); }

/* ---------- Refresh feedback: the single orchestrated moment ---------- */
.dash-flash .kpi-card { animation: dash-flash 0.8s ease; }
@keyframes dash-flash {
    from { border-color: var(--dash-accent-light); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    to   { border-color: var(--dash-border); box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08); }
}
@media (prefers-reduced-motion: reduce) {
    .dash-flash .kpi-card, .live-indicator.is-live .live-dot { animation: none; }
}
</style>
{% endblock %}

{% block content %}
<div class="dash">

  <div class="dash-live-bar">
    <span id="live-indicator" class="live-indicator is-live" role="status" aria-live="polite">
      <span class="live-dot"></span><span id="live-text">Live</span>
    </span>
  </div>

  <div id="dash-live"
       data-version="{{ dash_version }}"
       data-version-url="{% url 'dashboard-version' %}"
       data-body-url="{% url 'dashboard-body' %}">
    {% include 'users/_dashboard_body.html' %}
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/dashboard-live.js' %}"></script>
{% endblock %}
