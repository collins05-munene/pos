
<header class="topbar">
    <div class="left-side">
    </div>
    <div class="right-side">
        <!-- Notification Dropdown -->
        <div class="notification-dropdown-container">
            <button type="button" id="notificationBellBtn" class="notification-bell-btn" title="Notifications">
                🔔
                <span id="notificationBadge" class="notification-badge" style="display: none;">0</span>
            </button>
            <div id="notificationMenu" class="notification-menu">
                <div class="notification-header">
                    <span>Notifications</span>
                </div>
                <div id="notificationList" class="notification-list">
                    <p class="empty-notifications">No new notifications</p>
                </div>
            </div>
        </div>

        {% if active_branch %}
        <div class="branch-switch" title="Branch you are working at">
            {% if switchable_branches %}
            <select id="branchSwitchSelect" aria-label="Switch branch" style="padding:4px 8px;border-radius:6px;">
                {% for b in switchable_branches %}
                <option value="{{ b.pk }}" {% if b.pk == active_branch.pk %}selected{% endif %}>{{ b.name }}</option>
                {% endfor %}
            </select>
            <script>
            document.getElementById('branchSwitchSelect').addEventListener('change', async function () {
                const m = document.cookie.match(/(^| )csrftoken=([^;]+)/);
                const res = await fetch('/branches/switch/', {
                    method: 'POST', credentials: 'same-origin',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': m ? decodeURIComponent(m[2]) : ''},
                    body: JSON.stringify({branch_id: this.value})
                });
                if (res.ok) window.location.reload();
            });
            </script>
            {% else %}
            <span>{{ active_branch.name }}</span>
            {% endif %}
        </div>
        {% endif %}
        <div class="status">
            {% if user.role == 'ADMIN' %}
                Admin
            {% elif user.role == 'CASHIER' %}
                Cashier
            {% endif %}
        </div>
        <div class="profile">{{user.first_name}} {{user.last_name}}</div>
    </div>
</header>
