{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Management Login</title>
    <link rel="stylesheet" href="{% static 'users/css/auth.css' %}">
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">

        <h2 class="auth-title">Management Access</h2>
        <p class="auth-subtitle">Sign in with standard admin/manager credentials</p>

        <form method="POST">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="alert-banner alert-danger">
                    {{ form.non_field_errors|striptags }}
                </div>
            {% endif %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn-primary" type="submit">
                Authenticate
            </button>

        </form>

        <a href="{% url 'pin_login' %}" class="toggle-auth-link">
            Switch to Cashier Terminal
        </a>

    </div>

</div>

</body>
</html>
