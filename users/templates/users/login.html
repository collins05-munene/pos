{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Management Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon-32.png' %}">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <link rel="stylesheet" href="{% static 'users/css/auth.css' %}">
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">
        <div class="auth-progress-container" id="progressContainer">
            <div class="auth-progress-bar"></div>
        </div>

        <div class="auth-logo">
            <img src="{% static 'img/unisale-logo.png' %}" alt="UniSale Systems" width="409" height="141">
        </div>

        <h2 class="auth-title">Management Access</h2>

        <form method="POST" id="authForm">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="alert-banner alert-danger">
                    {{ form.non_field_errors|striptags }}
                </div>
            {% endif %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn-primary" type="submit" id="submitBtn">
                Authenticate
            </button>

        </form>

        <a href="{% url 'pin_login' %}" class="toggle-auth-link">
            Switch to Cashier Terminal
        </a>

    </div>

</div>

<script>
    document.getElementById('authForm').addEventListener('submit', function(e) {
        const container = document.getElementById('progressContainer');
        const btn = document.getElementById('submitBtn');
        
        container.style.display = 'block';
        btn.disabled = true;
        btn.style.opacity = '0.7';
        btn.innerText = 'Authenticating...';
    });
</script>

</body>
</html>
